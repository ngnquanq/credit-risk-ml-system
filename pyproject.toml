[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-model"
version = "0.1.0"
description = "Production-style credit risk decisioning platform prototype"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Nhat Quang", email = "nhatquang@example.com"}
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "minio>=7.2",
    "loguru>=0.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "xgboost>=2.0",
    "bentoml>=1.2",
    "mlflow>=2.9",
    "confluent-kafka>=2.3",
    "kafka-python>=2.0",
    "redis>=5.0",
    "feast[redis,kafka]>=0.40",
    "clickhouse-connect>=0.7",
    "opentelemetry-api>=1.22",
    "opentelemetry-sdk>=1.22",
    "opentelemetry-exporter-otlp-proto-grpc>=1.22",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "import-linter>=2.0",
    "jsonschema>=4.0",
]

[tool.setuptools.packages.find]
where = ["services/loan-api/src", "contracts", "libs", "services/model-lifecycle", "services/stream-features", "services/feature-store"]

[tool.setuptools.package-data]
feature_catalog = ["sets/*.json", "definitions/*.yaml", "reasons.yaml"]

# --- Formatting & Linting ---

[tool.black]
line-length = 88
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
known_third_party = ["celery", "django", "environ", "pyquery", "pytz", "redis", "requests", "rest_framework", "fastapi"]
src_paths = ["services/loan-api/src"]

# --- Static Type Checking ---

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "tests",
    "notebooks"
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --- Testing ---

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]
python_files = "test_*.py"
asyncio_mode = "auto"
pythonpath = ["services/loan-api/src", "services", "contracts", "libs", "services/model-lifecycle", "services/stream-features", "services/feature-store"]
markers = [
    "unit: Unit tests (no I/O)",
    "integration: Integration tests (in-memory DB, httpx)",
    "slow: Slow tests",
    "kafka: Tests involving Kafka mocks",
    "db: Tests involving database",
]
# --- Service boundaries (see docs/adr, services layout) ---
# Services talk through contracts/ (OpenAPI, feature_catalog, Kafka topics), never by importing each other.
[tool.importlinter]
root_packages = [
    # loan-api
    "audit", "authz", "core", "decisions", "domain", "entrypoints", "identity", "infrastructure", "workflows",
    # other services
    "scoring", "training", "flink", "feast_repo",
    # shared contract
    "feature_catalog",
    # shared library
    "observability",
]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "loan-api does not import the other services"
type = "forbidden"
source_modules = ["audit", "authz", "core", "decisions", "domain", "entrypoints", "identity", "infrastructure", "workflows"]
forbidden_modules = ["scoring", "training", "flink", "feast_repo"]

[[tool.importlinter.contracts]]
name = "scoring does not import the other services"
type = "forbidden"
source_modules = ["scoring"]
forbidden_modules = ["audit", "authz", "core", "decisions", "domain", "entrypoints", "identity", "infrastructure", "workflows", "training", "flink", "feast_repo"]
# Known exception: tracing is optional. service.py wraps this import in try/except and runs without it
# inside the Bento, where core does not exist. Give scoring its own tracing helper to remove it.
ignore_imports = ["scoring.service -> core.tracing"]

[[tool.importlinter.contracts]]
name = "model-lifecycle does not import the other services"
type = "forbidden"
source_modules = ["training"]
forbidden_modules = ["audit", "authz", "core", "decisions", "domain", "entrypoints", "identity", "infrastructure", "workflows", "scoring", "flink", "feast_repo"]

[[tool.importlinter.contracts]]
name = "streaming services do not import the other services"
type = "forbidden"
source_modules = ["flink", "feast_repo"]
forbidden_modules = ["audit", "authz", "core", "decisions", "domain", "entrypoints", "identity", "infrastructure", "workflows", "scoring", "training"]

[[tool.importlinter.contracts]]
name = "the shared catalog does not depend on any service"
type = "forbidden"
source_modules = ["feature_catalog"]
forbidden_modules = ["audit", "authz", "core", "decisions", "domain", "entrypoints", "identity", "infrastructure", "workflows", "scoring", "training", "flink", "feast_repo"]

[[tool.importlinter.contracts]]
name = "the shared logging library does not depend on any service"
type = "forbidden"
source_modules = ["observability"]
forbidden_modules = ["audit", "authz", "core", "decisions", "domain", "entrypoints", "identity", "infrastructure", "workflows", "scoring", "training", "flink", "feast_repo", "feature_catalog"]
