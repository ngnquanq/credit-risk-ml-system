apiVersion: batch/v1
kind: Job
metadata:
  name: feast-apply
  namespace: feature-registry
  labels:
    app: feast-apply
    component: feature-store
spec:
  ttlSecondsAfterFinished: 600  # Cleanup after 10 minutes
  template:
    metadata:
      labels:
        app: feast-apply
        component: feature-store
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
      - name: dockerhub-creds
      containers:
      - name: feast-apply
        # Built from application/feast/Dockerfile
        image: ngnquanq/feast-repo:v18
        imagePullPolicy: Always
        workingDir: /work
        command:
        - /bin/sh
        - -lc
        - python repository.py
        envFrom:
        - configMapRef:
            name: feast-config
        - configMapRef:
            name: shared-endpoints
        env:
        - name: FEAST_REGISTRY_URI
          value: s3://feast-registry/feature_repo/registry.db
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: model-serving-minio-credentials
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: model-serving-minio-credentials
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_DEFAULT_REGION
          value: us-east-1
        - name: AWS_S3_ENDPOINT
          valueFrom:
            configMapKeyRef: {name: shared-endpoints, key: SERVING_MINIO_URL}
        - name: FEAST_S3_ENDPOINT_URL
          valueFrom:
            configMapKeyRef: {name: shared-endpoints, key: SERVING_MINIO_URL}
        - name: APP_CLICKHOUSE_HOST
          valueFrom:
            configMapKeyRef: {name: shared-endpoints, key: CLICKHOUSE_HOST}
        - name: FEAST_REDIS_COORD_HOST
          valueFrom:
            configMapKeyRef: {name: shared-endpoints, key: FEAST_REDIS_HOST}
        volumeMounts:
        - name: feast-store-config
          mountPath: /work/feature_store.yaml
          subPath: feature_store.yaml
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: feast-store-config
        configMap:
          name: feast-store-config