apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace where feature store components will be deployed
namespace: feature-registry

# Common labels applied to all resources
commonLabels:
  project: home-credit
  tier: ml-platform

# Shared service addresses (KAFKA_BOOTSTRAP_SERVERS): platform/config/endpoints
components:
  - ../../../contracts/topics
  - ../../../platform/config/endpoints

# Resources to deploy
resources:
  - redis-deployment.yaml
  - feast-configmap.yaml
  - feast-store-config.yaml
  - feast-registry-pvc.yaml
  - feast-apply-job.yaml
  - feast-stream-deployment.yaml

# ConfigMap generator (alternative to feast-configmap.yaml if you want dynamic values)
# Uncomment and customize if needed:
# configMapGenerator:
#   - name: feast-config
#     literals:
#       - FEAST_KAFKA_BROKERS=192.168.1.42:9092
#       - FEAST_PROJECT=hc

# Images to use (allows easy version updates)
images:
  - name: redis
    newName: redis
    newTag: 7-alpine
  - name: your-registry/feast-repo
    newName: ngnquanq/feast-repo
    newTag: latest

# Resource name prefix (optional)
# namePrefix: hc-

# Annotations applied to all resources
commonAnnotations:
  description: "Feast feature store with Redis for Home Credit ML platform"
# Topic names are not environment variables here, so they are filled from the shared-topics ConfigMap.
replacements:
  - source: {kind: ConfigMap, name: shared-topics, fieldPath: data.TOPIC_APPLICATION_FEATURES}
    targets: [{select: {kind: ConfigMap, name: feast-config}, fieldPaths: [data.FEAST_TOPIC_APP_FEATURES]}]
  - source: {kind: ConfigMap, name: shared-topics, fieldPath: data.TOPIC_EXTERNAL_FEATURES}
    targets: [{select: {kind: ConfigMap, name: feast-config}, fieldPaths: [data.FEAST_TOPIC_EXTERNAL]}]
  - source: {kind: ConfigMap, name: shared-topics, fieldPath: data.TOPIC_DWH_FEATURES}
    targets: [{select: {kind: ConfigMap, name: feast-config}, fieldPaths: [data.FEAST_TOPIC_DWH]}]
  - source: {kind: ConfigMap, name: shared-topics, fieldPath: data.TOPIC_FEATURE_READY}
    targets: [{select: {kind: ConfigMap, name: feast-config}, fieldPaths: [data.FEAST_TOPIC_READY_FEATURE]}]
