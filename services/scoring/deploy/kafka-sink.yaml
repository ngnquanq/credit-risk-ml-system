apiVersion: eventing.knative.dev/v1alpha1
kind: KafkaSink
metadata:
  name: scoring-output-sink
  namespace: kserve
spec:
  bootstrapServers:
    - set-by-kustomize  # replaced with KAFKA_BOOTSTRAP_SERVERS from shared-endpoints (see kustomization.yaml)

  topic: hc.scoring

  contentMode: binary  # Publish clean JSON (not CloudEvents envelope)
