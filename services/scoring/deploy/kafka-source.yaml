apiVersion: sources.knative.dev/v1beta1
kind: KafkaSource
metadata:
  name: feature-ready-source
  namespace: kserve
spec:
  bootstrapServers:
    - set-by-kustomize  # replaced with KAFKA_BOOTSTRAP_SERVERS from shared-endpoints (see kustomization.yaml)

  topics:
    - set-by-kustomize

  consumerGroup: knative-scoring-consumer
  consumers: 8
  initialOffset: latest

  sink:
    ref:
      apiVersion: flows.knative.dev/v1
      kind: Sequence
      name: scoring-pipeline

  delivery:
    retry: 3
    backoffPolicy: exponential
    backoffDelay: PT1S
    deadLetterSink:
      ref:
        apiVersion: eventing.knative.dev/v1alpha1
        kind: KafkaSink
        name: scoring-dlq-sink
