apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kserve
resources:
  - kafka-sink.yaml
  - kafka-dlq-sink.yaml
  - scoring-sequence.yaml
  - kafka-source.yaml
components:
  - ../../../contracts/topics
  - ../../../platform/config/endpoints
# The Knative Kafka resources take the broker list in a spec field, not an environment variable.
replacements:
  - source:
      kind: ConfigMap
      name: shared-endpoints
      fieldPath: data.KAFKA_BOOTSTRAP_SERVERS
    targets:
      - select: {kind: KafkaSink}
        fieldPaths: [spec.bootstrapServers.0]
      - select: {kind: KafkaSource}
        fieldPaths: [spec.bootstrapServers.0]
  - source: {kind: ConfigMap, name: shared-topics, fieldPath: data.TOPIC_SCORING}
    targets: [{select: {kind: KafkaSink, name: scoring-output-sink}, fieldPaths: [spec.topic]}]
  - source: {kind: ConfigMap, name: shared-topics, fieldPath: data.TOPIC_SCORING_DLQ}
    targets: [{select: {kind: KafkaSink, name: scoring-dlq-sink}, fieldPaths: [spec.topic]}]
  - source: {kind: ConfigMap, name: shared-topics, fieldPath: data.TOPIC_FEATURE_READY}
    targets: [{select: {kind: KafkaSource, name: feature-ready-source}, fieldPaths: [spec.topics.0]}]
