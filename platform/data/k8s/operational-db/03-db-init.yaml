apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-scripts
  namespace: data-services
data:
  init-ops-database.sql: |
    -- ================================================================================
    -- Minimal Operational DB Init (CDC Only)
    -- Purpose: Create only the core tables used by the API and enable CDC
    -- ================================================================================

    -- Ensure replication permissions (required for Debezium logical replication)
    ALTER USER ops_admin WITH REPLICATION;

    -- Create core tables required by the application
    \i /schemas/001_create_loan_applications.sql
    \i /schemas/002_create_application_status_log.sql
    \i /schemas/003_status_log_event_id.sql
    \i /schemas/004_ownership_and_policy.sql
    \i /schemas/005_case_note.sql
    \i /schemas/006_public_ids_and_identity.sql

    -- Create CDC publication for Debezium
    CREATE PUBLICATION debezium_pub FOR TABLE loan_applications;

  001_create_loan_applications.sql: |
    CREATE TABLE IF NOT EXISTS loan_applications (
        -- Primary Key & Identity
        sk_id_curr VARCHAR(255) PRIMARY KEY,

        -- Basic Demographics (User Input - Raw Data)
        code_gender CHAR(1) CHECK (code_gender IN ('M', 'F')),
        birth_date DATE NOT NULL,  -- Store actual birth date, convert to days_birth in analytics
        cnt_children INTEGER DEFAULT 0 CHECK (cnt_children >= 0),

        -- Financial Information
        amt_income_total DECIMAL(15,2) NOT NULL CHECK (amt_income_total > 0),
        amt_credit DECIMAL(15,2) NOT NULL CHECK (amt_credit > 0),
        amt_annuity DECIMAL(15,2) CHECK (amt_annuity > 0),
        amt_goods_price DECIMAL(15,2) CHECK (amt_goods_price >= 0),

        -- Employment & Personal Details
        name_contract_type VARCHAR(50) DEFAULT 'Cash loans' CHECK (name_contract_type IN ('Cash loans', 'Revolving loans')),
        name_income_type VARCHAR(50) CHECK (name_income_type IN ('Working', 'Commercial associate', 'Pensioner', 'State servant', 'Student', 'Businessman', 'Maternity leave')),
        name_education_type VARCHAR(50) CHECK (name_education_type IN ('Secondary / secondary special', 'Higher education', 'Incomplete higher', 'Lower secondary', 'Academic degree')),
        name_family_status VARCHAR(50) CHECK (name_family_status IN ('Single / not married', 'Married', 'Civil marriage', 'Widow', 'Separated')),
        name_housing_type VARCHAR(50) CHECK (name_housing_type IN ('House / apartment', 'Rented apartment', 'With parents', 'Municipal apartment', 'Office apartment', 'Co-op apartment')),

        -- Employment Details
        employment_start_date DATE,  -- When person started current employment, convert to days_employed in analytics
        occupation_type VARCHAR(100),
        organization_type VARCHAR(100),

        -- Contact Information Flags
        flag_mobil INTEGER DEFAULT 0 CHECK (flag_mobil IN (0, 1)),
        flag_emp_phone INTEGER DEFAULT 0 CHECK (flag_emp_phone IN (0, 1)),
        flag_work_phone INTEGER DEFAULT 0 CHECK (flag_work_phone IN (0, 1)),
        flag_phone INTEGER DEFAULT 0 CHECK (flag_phone IN (0, 1)),
        flag_email INTEGER DEFAULT 0 CHECK (flag_email IN (0, 1)),

        -- Asset Ownership
        flag_own_car INTEGER DEFAULT 0 CHECK (flag_own_car IN (0, 1)),
        flag_own_realty INTEGER DEFAULT 0 CHECK (flag_own_realty IN (0, 1)),
        own_car_age INTEGER CHECK (own_car_age >= 0),

        -- Document Storage (MinIO Document IDs) - Ranges from 2 to 21
        document_id_2 VARCHAR(255),   -- Document type 2
        document_id_3 VARCHAR(255),   -- Document type 3
        document_id_4 VARCHAR(255),   -- Document type 4
        document_id_5 VARCHAR(255),   -- Document type 5
        document_id_6 VARCHAR(255),   -- Document type 6
        document_id_7 VARCHAR(255),   -- Document type 7
        document_id_8 VARCHAR(255),   -- Document type 8
        document_id_9 VARCHAR(255),   -- Document type 9
        document_id_10 VARCHAR(255),  -- Document type 10
        document_id_11 VARCHAR(255),  -- Document type 11
        document_id_12 VARCHAR(255),  -- Document type 12
        document_id_13 VARCHAR(255),  -- Document type 13
        document_id_14 VARCHAR(255),  -- Document type 14
        document_id_15 VARCHAR(255),  -- Document type 15
        document_id_16 VARCHAR(255),  -- Document type 16
        document_id_17 VARCHAR(255),  -- Document type 17
        document_id_18 VARCHAR(255),  -- Document type 18
        document_id_19 VARCHAR(255),  -- Document type 19
        document_id_20 VARCHAR(255),  -- Document type 20
        document_id_21 VARCHAR(255),  -- Document type 21

        -- Audit Fields
        created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
    );

    -- Create computed columns for FLAG_DOCUMENT_X (for ML compatibility)
    -- These will be computed by dbt: flag_document_X = CASE WHEN document_id_X IS NOT NULL THEN 1 ELSE 0 END

    -- Create indexes for performance
    CREATE INDEX IF NOT EXISTS idx_loan_applications_created_at ON loan_applications(created_at);
    CREATE INDEX IF NOT EXISTS idx_loan_applications_sk_id ON loan_applications(sk_id_curr);

    -- Create updated_at trigger
    CREATE OR REPLACE FUNCTION update_updated_at_column()
    RETURNS TRIGGER AS $$
    BEGIN
        NEW.updated_at = NOW();
        RETURN NEW;
    END;
    $$ language 'plpgsql';

    CREATE TRIGGER update_loan_applications_updated_at 
        BEFORE UPDATE ON loan_applications 
        FOR EACH ROW 
        EXECUTE FUNCTION update_updated_at_column();

    -- Comments for documentation
    COMMENT ON TABLE loan_applications IS 'Operational loan applications table with raw user-provided data. ML training transformations happen in analytics pipeline.';
    COMMENT ON COLUMN loan_applications.sk_id_curr IS 'Unique identifier for loan application';
    COMMENT ON COLUMN loan_applications.birth_date IS 'Customer birth date (raw PII data, converted to days_birth in analytics for privacy)';
    COMMENT ON COLUMN loan_applications.employment_start_date IS 'Employment start date (converted to days_employed in analytics pipeline)';
    COMMENT ON COLUMN loan_applications.created_at IS 'Application submission timestamp (weekday/hour extracted in analytics)';

  002_create_application_status_log.sql: |
    CREATE TABLE IF NOT EXISTS application_status_log (
        id BIGSERIAL PRIMARY KEY,
        sk_id_curr VARCHAR(255) NOT NULL REFERENCES loan_applications(sk_id_curr) ON DELETE CASCADE,

        -- Status Information
        status VARCHAR(50) NOT NULL CHECK (status IN (
            'submitted',           -- Initial submission
            'pre_screening',       -- Business rules validation
            'pre_screening_passed',
            'pre_screening_failed',
            'document_verification', 
            'bureau_requested',    -- External bureau API called
            'bureau_received',     -- Bureau data received
            'feature_engineering', -- Flink processing
            'ml_scoring',          -- Model inference
            'scoring_completed',
            'approved',            -- Final decisions
            'rejected',
            'manual_review',
            'cancelled',
            'error'                -- System errors
        )),

        -- Metadata
        created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW() NOT NULL,
        created_by VARCHAR(100) NOT NULL,  -- Which service/user made this change

        -- Additional Context
        metadata JSONB,  -- Service-specific data (scores, reasons, error details)

        -- Performance: Most queries will be by sk_id_curr + recent timestamps
        CONSTRAINT valid_created_by CHECK (created_by != '')
    );

    -- Performance indexes
    CREATE INDEX IF NOT EXISTS idx_application_status_log_sk_id_curr 
        ON application_status_log(sk_id_curr, created_at DESC);

    CREATE INDEX IF NOT EXISTS idx_application_status_log_status 
        ON application_status_log(status, created_at DESC);

    CREATE INDEX IF NOT EXISTS idx_application_status_log_created_at 
        ON application_status_log(created_at DESC);

    -- Create view for current status (most common query)
    CREATE OR REPLACE VIEW current_application_status AS
    SELECT DISTINCT ON (sk_id_curr) 
        sk_id_curr,
        status as current_status,
        created_at as status_updated_at,
        created_by as last_updated_by,
        metadata
    FROM application_status_log
    ORDER BY sk_id_curr, created_at DESC;

    -- Comments for documentation
    COMMENT ON TABLE application_status_log IS 'Event sourcing log for application status changes. Append-only table for full audit trail.';
    COMMENT ON COLUMN application_status_log.sk_id_curr IS 'Reference to loan application';
    COMMENT ON COLUMN application_status_log.status IS 'Application workflow status at this point in time';
    COMMENT ON COLUMN application_status_log.created_by IS 'Service or user that triggered this status change (api-service, ml-scoring-service, etc.)';
    COMMENT ON COLUMN application_status_log.metadata IS 'Additional context: scores, rejection reasons, error details, processing time, etc.';

    COMMENT ON VIEW current_application_status IS 'View showing current status of each application (most recent status log entry)';

    -- Example usage queries for documentation
    /*
    -- Insert new status change
    INSERT INTO application_status_log (sk_id_curr, status, created_by, metadata) 
    VALUES ('CUSTOMER_001', 'ml_scoring', 'ml-scoring-service', 
            '{"score": 0.85, "confidence": 0.92, "processing_time_ms": 150}');

    -- Get current status of application
    SELECT current_status FROM current_application_status WHERE sk_id_curr = 'CUSTOMER_001';

    -- Get full status history of application
    SELECT status, created_at, created_by, metadata 
    FROM application_status_log 
    WHERE sk_id_curr = 'CUSTOMER_001' 
    ORDER BY created_at;

    -- Get all applications in specific status
    SELECT sk_id_curr, status_updated_at 
    FROM current_application_status 
    WHERE current_status = 'ml_scoring';
    */

  003_status_log_event_id.sql: |
    -- E5: idempotent decision recording. One row per decision event; replays insert nothing.
    ALTER TABLE application_status_log ADD COLUMN IF NOT EXISTS event_id VARCHAR(64);
    CREATE UNIQUE INDEX IF NOT EXISTS uq_status_log_event_id
        ON application_status_log(event_id) WHERE event_id IS NOT NULL;

  004_ownership_and_policy.sql: |
    -- E11: who entered an application, who it belongs to, and four-eyes policy changes.
    ALTER TABLE loan_applications
        ADD COLUMN IF NOT EXISTS channel           VARCHAR(10) NOT NULL DEFAULT 'staff' CHECK (channel IN ('staff', 'self')),
        ADD COLUMN IF NOT EXISTS created_by_sub    VARCHAR(64),
        ADD COLUMN IF NOT EXISTS applicant_sub     VARCHAR(64),
        ADD COLUMN IF NOT EXISTS branch_id         VARCHAR(16),
        ADD COLUMN IF NOT EXISTS bureau_consent_at TIMESTAMP WITH TIME ZONE;
    CREATE INDEX IF NOT EXISTS idx_loan_applications_applicant_sub ON loan_applications(applicant_sub);
    CREATE INDEX IF NOT EXISTS idx_loan_applications_branch ON loan_applications(branch_id, created_at DESC);

    CREATE TABLE IF NOT EXISTS policy_change (
        id          BIGSERIAL PRIMARY KEY,
        proposed_by VARCHAR(64) NOT NULL,
        approved_by VARCHAR(64),
        payload     JSONB NOT NULL,                -- {"approve_below": 0.25, "reject_above": 0.35}
        state       VARCHAR(12) NOT NULL CHECK (state IN ('proposed', 'active', 'rejected', 'expired', 'superseded')),
        created_at  TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW(),
        decided_at  TIMESTAMP WITH TIME ZONE,
        CHECK (approved_by IS NULL OR approved_by <> proposed_by)
    );

  005_case_note.sql: |
    -- ADR-0013: loan officers add verification notes and flag concerns; underwriters read them.
    CREATE TABLE IF NOT EXISTS case_note (
        id         BIGSERIAL PRIMARY KEY,
        sk_id_curr VARCHAR(255) NOT NULL REFERENCES loan_applications(sk_id_curr) ON DELETE CASCADE,
        kind       VARCHAR(10)  NOT NULL CHECK (kind IN ('note', 'concern')),
        text       VARCHAR(1000) NOT NULL,
        author_sub VARCHAR(64)  NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW()
    );
    CREATE INDEX IF NOT EXISTS idx_case_note_application ON case_note(sk_id_curr, created_at);

  006_public_ids_and_identity.sql: |
    -- ADR-0014: opaque application ids for every URL, and applicant personal data kept apart.
    -- applicant_identity is NOT in the Debezium publication (only loan_applications is), so names,
    -- citizen ids and phone numbers never reach Kafka, Flink, ClickHouse or the feature store.

    ALTER TABLE loan_applications ADD COLUMN IF NOT EXISTS public_id UUID NOT NULL DEFAULT gen_random_uuid();
    CREATE UNIQUE INDEX IF NOT EXISTS ux_loan_applications_public_id ON loan_applications(public_id);

    CREATE TABLE IF NOT EXISTS applicant_identity (
        id               BIGSERIAL PRIMARY KEY,
        customer_ref     VARCHAR(255) NOT NULL UNIQUE,  -- internal customer key (loan_applications.sk_id_curr)
        citizen_id_hmac  CHAR(64)     NOT NULL UNIQUE,  -- HMAC-SHA256 with a separate key: exact-match lookup only
        full_name_enc    TEXT         NOT NULL,         -- envelope-encrypted (AES-256-GCM), see services/loan-api/src/identity
        citizen_id_enc   TEXT         NOT NULL,
        phone_enc        TEXT         NOT NULL,
        citizen_id_last3 CHAR(3)      NOT NULL,         -- for masked display only
        phone_last3      CHAR(3)      NOT NULL,
        key_id           VARCHAR(16)  NOT NULL,         -- KEK that wrapped the data keys (rotation)
        created_at       TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW()
    );
