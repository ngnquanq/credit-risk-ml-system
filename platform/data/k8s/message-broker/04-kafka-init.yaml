# ConfigMap: Kafka topic creation script (avoids YAML heredoc indentation issues)
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-create-topics-script
  namespace: data-services
data:
  create_topics.py: |
    import os
    from confluent_kafka.admin import AdminClient, NewTopic

    def create_topics(bootstrap, topics):
        admin = AdminClient({"bootstrap.servers": bootstrap})
        cluster_md = admin.list_topics(timeout=10)
        existing = set(cluster_md.topics.keys())
        to_create = [t for t in topics if t not in existing]
        if not to_create:
            print("All topics exist.")
            return
        # E15: RF 3 and min.insync.replicas 2 on the HA cluster; RF 1 on single-broker dev.
        rf = int(os.getenv("TOPIC_REPLICATION_FACTOR", "1"))
        config = {"min.insync.replicas": str(min(2, rf))}
        new_topics = [NewTopic(t, num_partitions=4, replication_factor=rf, config=config) for t in to_create]
        fs = admin.create_topics(new_topics)
        for t, f in fs.items():
            try:
                f.result()
                print(f"Created topic: {t}")
            except Exception as e:
                print(f"Failed to create topic {t}: {e}")

    bootstrap = os.environ["KAFKA_BOOTSTRAP_SERVERS"]
    # Every topic in contracts/topics/topics.env (the shared-topics ConfigMap) is created.
    topics = sorted(v for k, v in os.environ.items() if k.startswith("TOPIC_"))
    create_topics(bootstrap, topics)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-create-topics
  namespace: data-services
spec:
  template:
    spec:
      containers:
      - name: create-topics
        image: python:3.10-slim
        command: ["/bin/bash", "-c"]
        args:
          - |
            pip install confluent-kafka
            python /scripts/create_topics.py
        envFrom:
        - configMapRef:
            name: shared-topics
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef: {name: shared-endpoints, key: KAFKA_BOOTSTRAP_SERVERS}
        volumeMounts:
        - name: script
          mountPath: /scripts
      volumes:
      - name: script
        configMap:
          name: kafka-create-topics-script
      restartPolicy: OnFailure
  backoffLimit: 4
