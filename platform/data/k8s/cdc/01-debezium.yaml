# Debezium CDC Stack - Change Data Capture for Operational DB
# Components: Debezium Connect (Kafka Connect) + Connector Init Job
---
# ConfigMap for CDC connector configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: cdc-config
  namespace: data-services
data:
  # Kafka Connect settings
  GROUP_ID: "1"
  CONFIG_STORAGE_TOPIC: "connect_configs"
  OFFSET_STORAGE_TOPIC: "connect_offsets"
  STATUS_STORAGE_TOPIC: "connect_statuses"
  KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
  VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
  KEY_CONVERTER_SCHEMAS_ENABLE: "true"
  VALUE_CONVERTER_SCHEMAS_ENABLE: "true"
  KEY_CONVERTER_DECIMAL_FORMAT: "NUMERIC"
  VALUE_CONVERTER_DECIMAL_FORMAT: "NUMERIC"
  CONNECT_TOPIC_CREATION_ENABLE: "true"
  # Replication factor = 1 for single-broker local dev
  CONFIG_STORAGE_REPLICATION_FACTOR: "1"
  OFFSET_STORAGE_REPLICATION_FACTOR: "1"
  STATUS_STORAGE_REPLICATION_FACTOR: "1"
  # Postgres connection
  OPS_DB_PORT: "5432"
  OPS_DB_USER: "debezium_cdc"
  OPS_DB_NAME: "operations"
  # CDC settings
  CDC_TOPIC_PREFIX: "hc.applications"
  CDC_PUBLICATION_NAME: "debezium_pub"
  CDC_SLOT_NAME: "debezium_slot"
  CDC_CONNECTOR_NAME: "postgres-application-connector"
  CDC_PLUGIN_NAME: "pgoutput"
  CDC_SNAPSHOT_MODE: "initial"
---
# Debezium Connect Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: debezium-connect
  namespace: data-services
  labels:
    app: debezium-connect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: debezium-connect
  template:
    metadata:
      labels:
        app: debezium-connect
    spec:
      containers:
        - name: debezium
          image: debezium/connect:2.7.3.Final
          ports:
            - containerPort: 8083
              name: connect
          envFrom:
            - configMapRef:
                name: cdc-config
          env:
            # Debezium's image reads BOOTSTRAP_SERVERS; the shared key has the cluster-wide name.
            - name: BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef: {name: shared-endpoints, key: KAFKA_BOOTSTRAP_SERVERS}
            - name: OPS_DB_HOST
              valueFrom:
                configMapKeyRef: {name: shared-endpoints, key: OPS_DB_HOST}
            - name: CONNECT_CONFIG_PROVIDERS
              value: env
            - name: CONNECT_CONFIG_PROVIDERS_ENV_CLASS
              value: org.apache.kafka.common.config.provider.EnvVarConfigProvider
            - name: CDC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cdc-db-secrets
                  key: CDC_DB_PASSWORD
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /connectors
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /connectors
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 15
---
# Debezium Connect Service
apiVersion: v1
kind: Service
metadata:
  name: debezium-connect
  namespace: data-services
  labels:
    app: debezium-connect
spec:
  type: ClusterIP
  ports:
    - name: connect
      port: 8083
      targetPort: 8083
  selector:
    app: debezium-connect
