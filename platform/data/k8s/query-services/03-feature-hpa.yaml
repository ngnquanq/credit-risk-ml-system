apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: feature-consumer-hpa
  namespace: data-services
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: feature-consumer
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
