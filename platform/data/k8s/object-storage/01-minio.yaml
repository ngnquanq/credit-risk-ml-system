apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-minio-server
  namespace: data-services
  labels:
    app: data-minio-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-minio-server
  template:
    metadata:
      labels:
        app: data-minio-server
    spec:
      containers:
      - name: minio
        # minio/minio is no longer published. Same image and tag as the Helm charts in platform/ml/k8s.
        # The Bitnami entrypoint starts the server itself (data in /bitnami/minio/data, API :9000, console :9001).
        image: bitnamilegacy/minio:2025.7.23-debian-12-r3
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: minio-root-credentials
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minio-root-credentials
              key: MINIO_ROOT_PASSWORD
        ports:
        - containerPort: 9000
        - containerPort: 9001
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: data-minio-server
  namespace: data-services
spec:
  selector:
    app: data-minio-server
  ports:
  - name: api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001
  type: ClusterIP
