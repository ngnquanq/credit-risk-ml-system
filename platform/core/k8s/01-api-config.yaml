apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: api-gateway
data:
  # DB Connection (Cross-Namespace)
  OPS_DB_PORT: "5432"
  OPS_DB_NAME: "operations"
  OPS_DB_USER: "ops_admin"
  
  # API Configuration
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  
  # Addresses of other services (OPS_DB_HOST, MINIO_ENDPOINT, Kafka) come from the shared-endpoints ConfigMap.
  MINIO_BUCKET: "loan-documents"
  
  # Kafka 
