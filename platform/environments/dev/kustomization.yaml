apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../foundation/identity/00-namespace.yaml
  - ../../foundation/identity/01-keycloak-db.yaml
  - ../../foundation/identity/02-keycloak.yaml
  - ../../../portals/deploy
  - ../../config/namespaces/identity
  - ../../../services/loan-api/deploy/decision-recorder
# Local images built by `docker build` and loaded into Minikube.
images:
  - {name: crs-applicant-portal, newTag: dev}
  - {name: crs-staff-portal, newTag: dev}
  - {name: ngnquanq/credit-risk-consumers, newTag: dev}
patches:
  # One replica each is enough on a laptop.
  - target: {kind: StatefulSet, name: keycloak}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 1}
  - target: {kind: Deployment, name: "(applicant|staff)-portal"}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 1}
